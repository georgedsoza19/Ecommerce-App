# Free demo hosting on Render:
# 1. Create a free MongoDB Atlas cluster and copy the connection string.
# 2. In Render: New → Blueprint → connect this repo → apply.
# 3. Set env vars on the web service (see README → Deploy).
# 4. Free plan has no Shell — set SEED_ON_BOOT=true (below) or POST /api/seed
#    with header x-seed-secret: <SEED_SECRET>. You can also seed from your laptop
#    against Atlas: MONGODB_URI=... npm run seed --prefix server
#
# Free web services sleep after ~15 minutes of idle time; the first request
# after sleep can take 30–60 seconds.

services:
  - type: web
    name: geo-ecommerce
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build:deploy
    startCommand: npm run start:deploy
    healthCheckPath: /api/settings
    envVars:
      - key: NODE_ENV
        value: production
      # Keep install of build tools (Nest CLI, Vite) during npm ci
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: UPLOAD_DIR
        value: uploads
      - key: CLIENT_DIST
        value: public
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Seeds demo data once when the DB has no users (no Shell required).
      - key: SEED_ON_BOOT
        value: "true"
      # Optional one-shot seed via: curl -X POST .../api/seed -H "x-seed-secret: ..."
      - key: SEED_SECRET
        generateValue: true
      # Optional: https://<your-service>.onrender.com after first deploy.
      # If unset, CORS uses RENDER_EXTERNAL_URL automatically.
      - key: CLIENT_ORIGIN
        sync: false
